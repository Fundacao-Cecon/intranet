name: Tarefa técnica
description: Registrar uma tarefa do backlog com dependências e critérios de aceite.
title: "[T-XX] "
body:
  - type: markdown
    attributes:
      value: |
        Use os IDs de docs/planejamento.md e os requisitos de docs/arquitetura.md.
        Este formulário não altera automaticamente o status do planejamento.
  - type: input
    id: task_id
    attributes:
      label: ID da tarefa
      placeholder: T-06
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo e entrega
      description: Descreva o resultado verificável e os limites da tarefa.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Prioridade
      options:
        - P0
        - P1
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Estimativa relativa
      description: Não equivale a horas ou dias; refinar tarefas grandes antes do compromisso.
      options:
        - P
        - M
        - G
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint planejada
      placeholder: Sprint 2
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências e bloqueios
      description: Informe tarefas anteriores, acessos, parâmetros da TI e pendências; use "nenhuma" se não houver.
    validations:
      required: true
  - type: input
    id: references
    attributes:
      label: Requisitos e critérios
      placeholder: RF-01, RNF-03, CA-01
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite e evidência
      description: Registre os comportamentos esperados, testes aplicáveis e como comprovar a entrega.
    validations:
      required: true
  - type: input
    id: owner_role
    attributes:
      label: Responsável por papel e apoio da TI
      placeholder: Dev com apoio do Codex; TI valida o incremento.
