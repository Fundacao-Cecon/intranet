name: intranet-dev
x-app-environment: &app-environment
  APP_NAME: Intranet FCECON
  APP_ENV: local
  APP_KEY: ${APP_KEY:?Run scripts/dev.ps1 prepare}
  APP_DEBUG: "false"
  APP_URL: http://localhost:8080
  APP_LOCALE: pt_BR
  APP_FALLBACK_LOCALE: pt_BR
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: intranet_dev
  DB_USERNAME: intranet_app
  DB_PASSWORD: ${DB_RUNTIME_PASSWORD:?Run prepare}
  DB_MIGRATION_USERNAME: intranet_migrator
  DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Run prepare}
  SESSION_DRIVER: file
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  FILESYSTEM_DISK: local
  LOG_CHANNEL: stderr
x-app: &app
  image: intranet-app:sprint1-dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: development
    args:
      PHP_IMAGE: ${PHP_IMAGE:?Run prepare}
      COMPOSER_IMAGE: ${COMPOSER_IMAGE:?Run prepare}
  environment: *app-environment
  networks: [backend]
  volumes:
    - ./.env.example:/var/www/html/.env:ro
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap-cache:/var/www/html/bootstrap/cache
services:
  app:
    <<: *app
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, artisan, intranet:ready]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    image: ${NGINX_IMAGE:?Run prepare}
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [backend]
    depends_on: [app]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/up]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: ${POSTGRES_IMAGE:?Run prepare}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: intranet_dev
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Run prepare}
      MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Run prepare}
      RUNTIME_PASSWORD: ${DB_RUNTIME_PASSWORD:?Run prepare}
    volumes:
      - database:/var/lib/postgresql
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d intranet_dev"]
      interval: 5s
      timeout: 5s
      retries: 15
  scheduler:
    <<: *app
    profiles: [scheduler]
    command: [php, artisan, schedule:work]
    depends_on:
      db: {condition: service_healthy}
  node:
    image: ${NODE_IMAGE:?Run prepare}
    profiles: [tools]
    working_dir: /work
    volumes:
      - ./package.json:/work/package.json
      - ./package-lock.json:/work/package-lock.json
      - ./vite.config.js:/work/vite.config.js:ro
      - ./resources:/work/resources:ro
      - ./public:/work/public
      - ./app:/work/app:ro
      - ./routes:/work/routes:ro
      - vendor:/work/vendor:ro
      - node-modules:/work/node_modules
  db-test:
    image: ${POSTGRES_IMAGE:?Run prepare}
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: intranet_test
      POSTGRES_PASSWORD: ${TEST_ADMIN_PASSWORD:?Run prepare}
      MIGRATION_PASSWORD: ${TEST_MIGRATION_PASSWORD:?Run prepare}
      RUNTIME_PASSWORD: ${TEST_RUNTIME_PASSWORD:?Run prepare}
    tmpfs: [/var/lib/postgresql]
    volumes:
      - ./docker/postgres/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    networks: [testing]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d intranet_test"]
      interval: 5s
      timeout: 5s
      retries: 15
  test:
    <<: *app
    profiles: [test]
    environment:
      <<: *app-environment
      APP_ENV: testing
      DB_HOST: db-test
      DB_DATABASE: intranet_test
      DB_PASSWORD: ${TEST_RUNTIME_PASSWORD:?Run prepare}
      DB_MIGRATION_PASSWORD: ${TEST_MIGRATION_PASSWORD:?Run prepare}
    networks: [testing]
    volumes:
      - ./.env.example:/var/www/html/.env:ro
      - vendor:/var/www/html/vendor
      - test-storage:/var/www/html/storage
      - test-bootstrap-cache:/var/www/html/bootstrap/cache
    depends_on:
      db-test: {condition: service_healthy}
    command: [sh, -c, "php artisan migrate --database=pgsql_migrate --force && php artisan test"]
networks:
  backend:
  testing:
volumes:
  database:
  vendor:
  storage:
  bootstrap-cache:
  node-modules:
  test-storage:
  test-bootstrap-cache:
